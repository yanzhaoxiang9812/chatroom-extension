<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:240px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1c1c1c;color:#e0e0e0;display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:14px}
.title{font-size:15px;font-weight:700;color:#fff}
.status{font-size:12px;color:#888;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#ef4444}
.dot.on{background:#4ade80}
.toggle-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;color:#fff}
.toggle-btn.open{background:#16a34a}
.toggle-btn.close{background:#ef4444}
.toggle-btn:hover{opacity:.85}
.hint{font-size:11px;color:#666;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="title">Xchat</div>
<div class="status"><span class="dot" id="status-dot"></span><span id="status-text">Hidden</span></div>
<button class="toggle-btn" id="toggle-btn">Open</button>
<div class="hint">Open shows the chat button on the page and opens the chat. Close hides it.</div>
<script src="popup.js"></script>
</body>
</html>
